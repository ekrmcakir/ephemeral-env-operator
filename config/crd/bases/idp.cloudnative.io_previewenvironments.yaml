---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
  name: previewenvironments.idp.cloudnative.io
spec:
  group: idp.cloudnative.io
  names:
    kind: PreviewEnvironment
    listKind: PreviewEnvironmentList
    plural: previewenvironments
    singular: previewenvironment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Pull Request Number
      jsonPath: .spec.prNumber
      name: PR
      type: integer
    - description: Git Branch
      jsonPath: .spec.branch
      name: Branch
      type: string
    - description: Lifecycle Phase
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: Allocated Namespace
      jsonPath: .status.targetNamespace
      name: Namespace
      type: string
    - description: Configured TTL
      jsonPath: .spec.ttl
      name: TTL
      type: string
    - description: TTL Expiry Date
      jsonPath: .status.expiresAt
      name: ExpiresAt
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PreviewEnvironment is the Schema for the previewenvironments API
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: PreviewEnvironmentSpec defines desired state of PreviewEnvironment
            properties:
              author:
                type: string
              autoCleanup:
                default: true
                type: boolean
              branch:
                type: string
              ingress:
                properties:
                  enabled:
                    default: true
                    type: boolean
                  hostTemplate:
                    default: pr-{{.PRNumber}}.preview.cloudnative.io
                    type: string
                  ingressClassName:
                    default: nginx
                    type: string
                  path:
                    default: /
                    type: string
                  tls:
                    default: false
                    type: boolean
                type: object
              isolatedNetwork:
                default: true
                type: boolean
              mockDatabase:
                properties:
                  databaseName:
                    default: preview_db
                    type: string
                  engine:
                    enum:
                    - postgres
                    - redis
                    - mongodb
                    - mysql
                    type: string
                  ephemeral:
                    default: true
                    type: boolean
                  seedDataConfigMap:
                    type: string
                required:
                - engine
                type: object
              namespacePrefix:
                default: preview-pr
                type: string
              prNumber:
                minimum: 1
                type: integer
              repository:
                type: string
              resources:
                properties:
                  cpuLimit:
                    default: 2000m
                    type: string
                  maxPods:
                    default: 15
                    type: integer
                  memoryLimit:
                    default: 4Gi
                    type: string
                type: object
              ttl:
                default: 4h
                type: string
              workloads:
                items:
                  properties:
                    image:
                      type: string
                    name:
                      type: string
                    port:
                      type: integer
                    replicas:
                      default: 1
                      type: integer
                  required:
                  - image
                  - name
                  - port
                  type: object
                type: array
            required:
            - branch
            - prNumber
            - ttl
            - workloads
            type: object
          status:
            description: PreviewEnvironmentStatus defines observed state of PreviewEnvironment
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              createdAt:
                format: date-time
                type: string
              endpoints:
                items:
                  properties:
                    name:
                      type: string
                    port:
                      type: integer
                    url:
                      type: string
                  required:
                  - name
                  - port
                  - url
                  type: object
                type: array
              expiresAt:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
              readyReplicas:
                type: integer
              targetNamespace:
                type: string
              totalReplicas:
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
