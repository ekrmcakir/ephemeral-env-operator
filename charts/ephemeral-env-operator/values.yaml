replicaCount: 1

image:
  repository: ghcr.io/ekrmcakir/ephemeral-env-operator
  pullPolicy: IfNotPresent
  tag: "v1.0.0"

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

metrics:
  enabled: true
  port: 8080

healthProbes:
  port: 8081

ttlGarbageCollection:
  interval: "2m"

rbac:
  create: true

serviceAccount:
  create: true
  name: ""

leaderElection:
  enabled: true
